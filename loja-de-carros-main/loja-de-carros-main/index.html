<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Sistema de Carros</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <div class="container">
        <h1>SISTEMA DE CARROS</h1>
        <p>Faça seu login para acessar a loja de automóveis</p> 
        <br>

        <!-- Campos de Login -->
        <input type="text" id="usuario" placeholder="Digite seu usuário">
        <br><br>
        <input type="password" id="senha" placeholder="Digite sua senha">
        <br><br>
        
        <button id="enviar">Entrar</button>

        <p id="resultado" style="margin-top: 20px; text-align: center; font-weight: bold;"></p>
    </div>

    <!-- Conexão com o arquivo JavaScript externo -->
    <script src="script.js"></script>
</body>
</html>
